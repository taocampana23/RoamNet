name: Import RoamNet Expo source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-project:
    if: ${{ hashFiles('RoamNet-expo-project.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract the Expo project into the repository root
        run: |
          unzip -o RoamNet-expo-project.zip
          cp -a RoamNet/. .
          rm -rf RoamNet RoamNet-expo-project.zip

      - name: Commit the application source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add RoamNet Expo application source files"
          git push
